<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tidewater</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #scene { display: block; width: 100vw; height: 100vh; }

      #overlay {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 0.75rem;
        background: rgba(0, 0, 0, 0.55); cursor: pointer; z-index: 10;
        color: #dfe8ea; font: 400 15px/1.5 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.02em; -webkit-font-smoothing: antialiased;
      }
      #overlay h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.14em; }
      #overlay p { margin: 0; opacity: 0.65; }

      /* the readout — what is playing, so you are never guessing */
      #hud {
        position: fixed; left: 14px; bottom: 12px; z-index: 5; pointer-events: none;
        color: #cfe0e4; font: 400 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); opacity: 0.8;
      }
      #hud b { font-weight: 600; letter-spacing: 0.08em; }
      body.still #hud, body.still #overlay { display: none; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="overlay">
      <h1>tidewater</h1>
      <p>click to begin</p>
    </div>
    <div id="hud"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
